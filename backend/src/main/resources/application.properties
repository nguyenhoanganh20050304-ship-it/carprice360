spring.application.name=carprice360

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=carprice360db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

server.port=8080

jwt.secret=carprice360-super-secret-key-2024-very-long-string
jwt.expiration=86400000
# ✅ Thư mục lưu ảnh upload (trỏ tới thư mục image/cars/ của frontend)
# Đổi đường dẫn này cho phù hợp với máy của bạn
# Ví dụ Windows: upload.path=C:/Projects/frontend/image/cars/
# Ví dụ Linux/Mac: upload.path=/home/user/project/frontend/image/cars/
upload.path=../frontend/image/cars/

# Cho phép upload file lớn (5 ảnh)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
