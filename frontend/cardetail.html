<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi tiết xe - CarPrice360</title>
<link rel="stylesheet" href="cardetail.css">
</head>
<body>
<header>
  <div class="header-top">
    <a href="index.html" class="logo">
      <div class="logo-icon">C</div>
      <span class="logo-text">CarPrice360</span>
    </a>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="index.html#brands">Thương hiệu</a>
      <a href="index.html#cars">Danh sách xe</a>
      <a href="showroom.html">Showroom</a>
      <a href="compare.html">So sánh xe</a>
      <a href="saved.html">Xe đã lưu</a>
    </nav>
    <div class="header-actions" id="headerActions">
  <a class="btn-login btn-outline" onclick="openModal('login')">Đăng nhập</a>
  <a class="btn-login btn-solid" onclick="openModal('register')">Đăng ký</a>
  </div>
  </div>
</header>
<div class="breadcrumb" id="breadcrumb">
  <a href="index.html">🏠</a>
  <span class="sep">›</span>
  <a href="index.html">Trang chủ</a>
  <span class="sep">›</span>
  <span id="bcBrand">...</span>
  <span class="sep">›</span>
  <span class="current" id="bcName">...</span>
</div>
<div id="pageContent">
  <div class="page-loading">
    <div class="spinner"></div>
    <p>Đang tải thông tin xe...</p>
  </div>
</div>
<div class="sticky-bar" id="stickyBar" style="display:none">
  <div class="sticky-inner">
    <div class="sticky-tabs">
      <button class="sticky-tab" onclick="scrollToTab('specs')" id="stab-specs">
        <span class="st-icon">📋</span>
        <span>Thông số</span>
      </button>
      <button class="sticky-tab" onclick="scrollToTab('similar')" id="stab-similar">
        <span class="st-icon">🚗</span>
        <span>Xe tương tự</span>
      </button>
      <button class="sticky-tab" onclick="goCompare()" id="stab-compare">
        <span class="st-icon">⚖️</span>
        <span>So sánh xe này</span>
      </button>
      <button class="sticky-tab" onclick="goShowroom()" id="stab-showroom">
        <span class="st-icon">🏪</span>
        <span>Tìm showroom</span>
      </button>
    </div>
    <div class="sticky-actions">
      <button class="sticky-btn" id="btnSave" onclick="toggleSave()">
        <span id="saveIcon">🔖</span>
        <span id="saveText">Lưu xe</span>
      </button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <span class="modal-close" onclick="closeModal('login')">×</span>
    <h2>Đăng nhập</h2>
    <div class="msg" id="loginMsg"></div>
    <input class="modal-input" id="loginEmail" type="email" placeholder="Email">
    <input class="modal-input" id="loginPass" type="password" placeholder="Mật khẩu">
    <button class="modal-btn" onclick="doLogin()">Đăng nhập</button>
    <div class="modal-switch">Chưa có tài khoản? <a onclick="switchModal('login','register')">Đăng ký ngay</a></div>
  </div>
</div>
<div class="modal-overlay" id="registerModal">
  <div class="modal">
    <span class="modal-close" onclick="closeModal('register')">×</span>
    <h2>Đăng ký tài khoản</h2>
    <div class="msg" id="registerMsg"></div>
    <input class="modal-input" id="regName" type="text" placeholder="Họ và tên">
    <input class="modal-input" id="regEmail" type="email" placeholder="Email">
    <input class="modal-input" id="regPass" type="password" placeholder="Mật khẩu">
    <button class="modal-btn" onclick="doRegister()">Đăng ký</button>
    <div class="modal-switch">Đã có tài khoản? <a onclick="switchModal('register','login')">Đăng nhập</a></div>
  </div>
</div>
<script src="cardetail.js"></script>
</body>
</html>
