<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xe đã lưu - CarPrice360</title>
<link rel="stylesheet" href="/css/saved.css">
</head>
<body>
<header>
  <div class="header-top">
    <a href="index.html" class="logo">
      <div class="logo-icon">C</div>
      <span class="logo-text">CarPrice360</span>
    </a>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="index.html#brands">Thương hiệu</a>
      <a href="index.html#cars">Danh sách xe</a>
      <a href="showroom.html">Showroom</a>
      <a href="compare.html">So sánh xe</a>
      <a href="saved.html" class="active">Xe đã lưu</a>
    </nav>
    <div class="header-actions" id="headerActions">
      <a class="btn-login btn-outline" onclick="openModal('login')">Đăng nhập</a>
      <a class="btn-login btn-solid" onclick="openModal('register')">Đăng ký</a>
    </div>
  </div>
</header>

<!-- ── MAIN CONTENT ── -->
<div class="page-wrapper">
  <div id="mainContent">
    <!-- Render bởi JS -->
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<!-- ── CONFIRM XÓA TẤT CẢ ── -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-icon">🗑️</div>
    <h3>Xóa tất cả xe đã lưu?</h3>
    <p>Danh sách yêu thích của bạn sẽ bị xóa toàn bộ. Không thể hoàn tác.</p>
    <div class="confirm-btns">
      <button class="btn-cancel-confirm" onclick="closeConfirm()">Hủy</button>
      <button class="btn-ok-confirm" onclick="clearAll()">Xóa tất cả</button>
    </div>
  </div>
</div>

<!-- ── MODAL ĐĂNG NHẬP (bê nguyên từ cardetail.html) ── -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <span class="modal-close" onclick="closeModal('login')">×</span>
    <h2>Đăng nhập</h2>
    <div class="msg" id="loginMsg"></div>
    <input class="modal-input" id="loginEmail" type="email" placeholder="Email">
    <input class="modal-input" id="loginPass" type="password" placeholder="Mật khẩu">
    <button class="modal-btn" onclick="doLogin()">Đăng nhập</button>
    <div class="modal-switch">Chưa có tài khoản? <a onclick="switchModal('login','register')">Đăng ký ngay</a></div>
  </div>
</div>

<!-- ── MODAL ĐĂNG KÝ (bê nguyên từ cardetail.html) ── -->
<div class="modal-overlay" id="registerModal">
  <div class="modal">
    <span class="modal-close" onclick="closeModal('register')">×</span>
    <h2>Đăng ký tài khoản</h2>
    <div class="msg" id="registerMsg"></div>
    <input class="modal-input" id="regName" type="text" placeholder="Họ và tên">
    <input class="modal-input" id="regEmail" type="email" placeholder="Email">
    <input class="modal-input" id="regPass" type="password" placeholder="Mật khẩu">
    <button class="modal-btn" onclick="doRegister()">Đăng ký</button>
    <div class="modal-switch">Đã có tài khoản? <a onclick="switchModal('register','login')">Đăng nhập</a></div>
  </div>
</div>
<script src="/javascrip/saved.js"></script>
</body>
</html>
