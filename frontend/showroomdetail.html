<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi tiết Showroom - CarPrice360</title>
<link rel="stylesheet" href="showroomdetail.css">
</head>
<body>

<header>
  <div class="header-top">
    <a href="index.html" class="logo">
      <div class="logo-icon">C</div>
      <span class="logo-text">CarPrice360</span>
    </a>
    <nav>
      <a href="index.html">Trang chủ</a>
      <a href="index.html#brands">Thương hiệu</a>
      <a href="index.html#cars">Danh sách xe</a>
      <a href="compare.html">So sánh xe</a>
      <a href="showroom.html">Showroom</a>
      <a href="saved.html">Xe đã lưu</a>
    </nav>
    <div class="header-actions" id="headerActions">
      <a class="btn-login btn-outline" onclick="openModal('login')">Đăng nhập</a>
      <a class="btn-login btn-solid" onclick="openModal('register')">Đăng ký</a>
    </div>
  </div>
</header>

<div class="breadcrumb">
  <a href="index.html">Trang chủ</a>
  <span class="sep">›</span>
  <a href="showroom.html">Showroom</a>
  <span class="sep">›</span>
  <span class="current" id="bcName">Chi tiết</span>
</div>

<div class="detail-wrapper">


  <div class="gallery-panel">
    <div class="gallery-main">
      <img id="heroImg" src="" alt="Showroom Image">
    </div>
  </div>


  <div class="info-panel">
    <div class="brand-tag" id="infoBrandTag"></div>
    <div class="showroom-name" id="infoName"></div>

    <div class="brand-row">
      <img id="infoBrandLogo" class="brand-logo-sm" src="" alt=""
        onerror="this.style.display='none'" style="display:none">
      <div class="city-badge" id="infoCityBadge"></div>
    </div>

    <hr class="divider">


    <div class="info-item">
      <div class="icon">📍</div>
      <div>
        <div class="label">Địa chỉ</div>
        <div class="value" id="infoAddress">—</div>
      </div>
    </div>


    <div class="info-item">
      <div class="icon">📞</div>
      <div>
        <div class="label">Hotline</div>
        <div class="value" id="infoPhone">—</div>
      </div>
    </div>
  </div>
</div>


<div class="cars-section">
  <div class="section-title">Xe <span id="carBrandTitle"></span> đang có</div>
  <div class="car-grid" id="carGrid">
    <div class="loading"><div class="spinner"></div>Đang tải xe...</div>
  </div>
</div>

<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <span class="modal-close" onclick="closeModal('login')">×</span>
    <h2>Đăng nhập</h2>
    <div class="msg" id="loginMsg"></div>
    <input class="modal-input" id="loginEmail" type="email" placeholder="Email" autocomplete="off">
    <input class="modal-input" id="loginPass" type="password" placeholder="Mật khẩu" autocomplete="off">
    <button class="modal-btn" onclick="doLogin()">Đăng nhập</button>
    <div class="modal-switch">Chưa có tài khoản? <a onclick="switchModal('login','register')">Đăng ký ngay</a></div>
  </div>
</div>
<div class="modal-overlay" id="registerModal">
  <div class="modal">
    <span class="modal-close" onclick="closeModal('register')">×</span>
    <h2>Đăng ký tài khoản</h2>
    <div class="msg" id="registerMsg"></div>
    <input class="modal-input" id="regName" type="text" placeholder="Họ và tên">
    <input class="modal-input" id="regEmail" type="email" placeholder="Email">
    <input class="modal-input" id="regPass" type="password" placeholder="Mật khẩu">
    <button class="modal-btn" onclick="doRegister()">Đăng ký</button>
    <div class="modal-switch">Đã có tài khoản? <a onclick="switchModal('register','login')">Đăng nhập</a></div>
  </div>
</div>
<script src="showroomdetail.js" defer> </script>
</body>
</html>
